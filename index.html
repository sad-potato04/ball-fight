<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ball Fight</title>
<style>
  body {
    margin: 0;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }

  h1 {
    font-size: 22px;
    margin: 8px 0 4px;
    color: #111;
    letter-spacing: 1px;
  }

  /* 선택 화면 */
  #select-screen { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 500px; }
  .select-hint { font-size: 13px; color: #555; }
  .select-labels { display: flex; gap: 30px; font-size: 12px; font-weight: bold; }
  .lp1 { color: #e00; }
  .lp2 { color: #00c; }

  .char-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .char-card {
    width: 110px;
    border: 2px solid #999;
    border-radius: 6px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    user-select: none;
  }
  .char-card:hover { border-color: #333; }
  .char-card.sel-p1 { border: 3px solid #e00; background: #fff0f0; }
  .char-card.sel-p2 { border: 3px solid #00c; background: #f0f0ff; }
  .cball {
    width: 52px; height: 52px; border-radius: 50%;
    margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; color: #fff;
    border: 2px solid rgba(0,0,0,0.2);
  }
  .cname { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
  .chp { font-size: 10px; color: #777; margin-bottom: 3px; }
  .cskills { font-size: 9px; color: #999; line-height: 1.4; text-align: left; }

  #start-btn {
    padding: 8px 36px; font-size: 16px; font-weight: bold;
    background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer;
    letter-spacing: 2px;
  }
  #start-btn:disabled { background: #aaa; cursor: default; }

  /* 배틀 화면 */
  #battle-screen { display: none; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 520px; }

  /* HUD */
  #hud {
    display: flex; align-items: flex-start; gap: 6px;
    width: 100%;
  }
  .hside { flex: 1; }
  .hside.right { text-align: right; }
  .hname { font-size: 11px; font-weight: bold; color: #111; margin-bottom: 2px; }
  .hhpnum { font-size: 10px; color: #555; margin-bottom: 2px; }
  .hptrack { height: 14px; background: #ddd; border: 1px solid #bbb; border-radius: 2px; overflow: hidden; }
  .hpfill { height: 100%; transition: width 0.1s; }
  .hpfill.c1 { background: #e00; }
  .hpfill.c2 { background: #00c; }
  .sdots { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
  .sdots.right { justify-content: flex-end; }
  .sdot { font-size: 8px; padding: 1px 5px; background: #eee; border: 1px solid #ccc; border-radius: 3px; color: #888; }
  .sdot.ready { background: #d4edda; color: #155724; border-color: #5cb85c; }
  .hvs { font-size: 18px; font-weight: bold; color: #999; padding-top: 2px; }

  /* 아레나 */
  #arena-wrap {
    width: 100%;
    position: relative;
  }
  #arena {
    width: 100%;
    aspect-ratio: 1 / 0.8;
    background: #ffffff;
    border: 3px solid #111;
    position: relative;
    overflow: hidden;
    display: block;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
  }

  /* 이름표 (공 아래) */
  .ball-label {
    position: absolute;
    font-size: 9px;
    font-weight: bold;
    color: #111;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
    transform: translateX(-50%);
  }

  /* 데미지 텍스트 */
  .dmgtxt {
    position: absolute;
    font-weight: bold;
    pointer-events: none;
    z-index: 20;
    animation: rise 0.85s ease-out forwards;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-36px); }
  }

  /* 충돌 링 */
  .ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 15;
    animation: expand 0.4s ease-out forwards;
  }
  @keyframes expand {
    0% { opacity: 0.6; transform: scale(0.3); }
    100% { opacity: 0; transform: scale(2.5); }
  }

  /* 결과 */
  #result {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 50;
  }
  #result.show { display: flex; }
  #res-title { font-size: 22px; font-weight: bold; color: #111; }
  #res-sub { font-size: 12px; color: #666; }
  #res-btn {
    margin-top: 6px; padding: 7px 22px; font-size: 13px; font-weight: bold;
    background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer;
  }

  /* 각성 */
  .awaken-flash {
    position: absolute; inset: 0;
    background: rgba(255,60,0,0.28);
    pointer-events: none;
    animation: af 0.8s ease-out forwards;
    z-index: 30;
  }
  @keyframes af { 0%{opacity:1;} 100%{opacity:0;} }
  .awaken-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: 18px; font-weight: bold; color: #ff2200;
    pointer-events: none;
    animation: af 1.2s ease-out forwards;
    z-index: 31;
    white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  /* 로그 */
  #log {
    width: 100%;
    font-size: 10px; color: #666;
    background: #fff; border: 1px solid #ccc;
    padding: 5px 8px;
    max-height: 55px; overflow-y: auto;
    line-height: 1.7;
    border-radius: 3px;
  }
</style>
</head>
<body>

<h1>⚔️ BALL FIGHT</h1>

<div id="select-screen">
  <div class="select-labels">
    <span class="lp1">● 1P (빨강)</span>
    <span class="lp2">● 2P (파랑)</span>
  </div>
  <div class="char-grid" id="char-grid"></div>
  <p class="select-hint" id="hint">캐릭터를 2명 선택하세요</p>
  <button id="start-btn" disabled>START</button>
</div>

<div id="battle-screen">
  <div id="hud">
    <div class="hside">
      <div class="hname" id="n1"></div>
      <div class="hhpnum" id="hp1num"></div>
      <div class="hptrack"><div class="hpfill c1" id="hp1" style="width:100%"></div></div>
      <div class="sdots" id="sd1"></div>
    </div>
    <div class="hvs">VS</div>
    <div class="hside right">
      <div class="hname" id="n2"></div>
      <div class="hhpnum" id="hp2num"></div>
      <div class="hptrack"><div class="hpfill c2" id="hp2" style="width:100%"></div></div>
      <div class="sdots right" id="sd2"></div>
    </div>
  </div>

  <div id="arena-wrap">
    <div id="arena">
      <canvas id="canvas"></canvas>
      <div id="result">
        <div id="res-title"></div>
        <div id="res-sub"></div>
        <button id="res-btn">다시 선택</button>
      </div>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
const DEFS = [
  {
    id:'nodojin', name:'나도진', label:'도진',
    color:'#FF6B35', maxHp:50, r:22, meleeDmg:0,
    skills:[], special:'awaken'
  },
  {
    id:'awaken_nodojin', name:'각성나도진', label:'각성\n도진',
    color:'#CC2200', maxHp:250, r:26, meleeDmg:10,
    skills:[
      {name:'얘들아 나 탁구채 안가져왔다', label:'탁구채', dmg:50, cd:3000, last:-99999, type:'paddle', color:'#FF6B35', spd:3.2},
      {name:'미국수도 LA아닌가?', label:'LA', dmg:80, cd:10000, last:-99999, type:'LA', color:'#CC2200', spd:2.5},
    ]
  },
  {
    id:'seoonem', name:'서온음', label:'온음',
    color:'#378ADD', maxHp:250, r:23, meleeDmg:15,
    skills:[
      {name:'나 아이언 아니라니까!', label:'철광석', dmg:100, cd:7000, last:-99999, type:'rock', color:'#5F5E5A', spd:2.2},
    ]
  }
];

const DISPLAY = DEFS.filter(d => d.id !== 'awaken_nodojin');
let selected=[], p1=null, p2=null, balls=[], projs=[];
let canvas, ctx, AW, AH;
let running=false, raf=null, prevT=0, logs=[];
let labelEls = {};

function cloneDef(d){ const o={...d}; o.skills=(d.skills||[]).map(s=>({...s})); return o; }

/* 그리기 함수들 */
function drawPaddle(x,y,angle){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  ctx.strokeStyle='#6D4C41'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(0,24); ctx.stroke();
  ctx.fillStyle='#E53935';
  ctx.beginPath(); ctx.ellipse(0,0,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#B71C1C'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,11,13,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(-3,-3,4,5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawRock(x,y,angle){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  ctx.fillStyle='#757575'; ctx.strokeStyle='#424242'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-11,-5); ctx.lineTo(-5,-13); ctx.lineTo(5,-13);
  ctx.lineTo(13,-3); ctx.lineTo(11,7); ctx.lineTo(1,13);
  ctx.lineTo(-9,11); ctx.lineTo(-13,1); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(-3,-5,3,2,Math.PI/5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLA(x,y){
  ctx.save(); ctx.translate(x,y);
  const w=50, h=28;
  ctx.fillStyle='#CC2200';
  ctx.beginPath(); roundRect(ctx,-w/2,-h/2,w,h,5); ctx.fill();
  ctx.strokeStyle='#880000'; ctx.lineWidth=2;
  ctx.beginPath(); roundRect(ctx,-w/2,-h/2,w,h,5); ctx.stroke();
  ctx.font='bold 22px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff';
  ctx.fillText('LA', 0, 1);
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
}

function drawBall(b){
  ctx.save();
  ctx.fillStyle = b.def.color;
  ctx.strokeStyle = b.border; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.def.r, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${b.def.r>24?10:12}px Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = b.def.label.split('\n');
  if(lines.length===1){ ctx.fillText(lines[0], b.x, b.y); }
  else { ctx.fillText(lines[0], b.x, b.y-6); ctx.fillText(lines[1], b.x, b.y+6); }
  ctx.restore();
}

/* 선택 화면 */
function buildCards(){
  const g = document.getElementById('char-grid'); g.innerHTML='';
  DISPLAY.forEach(d=>{
    const c = document.createElement('div');
    c.className='char-card'; c.dataset.id=d.id;
    const skText = d.id==='nodojin'
      ? '스킬 없음<br>💥 죽으면 각성!'
      : (d.skills||[]).map(s=>`· ${s.name}`).join('<br>');
    const hpText = d.id==='nodojin' ? '50 → 각성250' : d.maxHp;
    c.innerHTML = `
      <div class="cball" style="background:${d.color}">${d.id==='nodojin'?'도진':'온음'}</div>
      <div class="cname">${d.name}</div>
      <div class="chp">HP ${hpText}</div>
      <div class="cskills">${skText}</div>`;
    c.addEventListener('click', ()=>pick(d.id));
    g.appendChild(c);
  });
}

function pick(id){
  if(selected.includes(id)){ selected=selected.filter(s=>s!==id); }
  else { if(selected.length>=2) return; selected.push(id); }
  document.querySelectorAll('.char-card').forEach(c=>{
    c.classList.remove('sel-p1','sel-p2');
    if(selected[0]===c.dataset.id) c.classList.add('sel-p1');
    if(selected[1]===c.dataset.id) c.classList.add('sel-p2');
  });
  document.getElementById('hint').textContent =
    selected.length===0 ? '캐릭터를 2명 선택하세요' :
    selected.length===1 ? '1명 더 선택하세요' : '준비완료!';
  document.getElementById('start-btn').disabled = selected.length < 2;
}

document.getElementById('start-btn').addEventListener('click', startBattle);
document.getElementById('res-btn').addEventListener('click', ()=>{
  stop(); selected=[];
  document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('sel-p1','sel-p2'));
  document.getElementById('battle-screen').style.display='none';
  document.getElementById('select-screen').style.display='flex';
  document.getElementById('hint').textContent='캐릭터를 2명 선택하세요';
  document.getElementById('start-btn').disabled=true;
});

function makeBall(def,x,y,border){
  return {
    def, x, y,
    vx: (x<AW/2?1:-1)*(2.5+Math.random()),
    vy: (Math.random()-0.5)*3,
    hp: def.maxHp, maxHp: def.maxHp,
    alive: true, border, awakened: false, mcd:0, angle:0
  };
}

function startBattle(){
  document.getElementById('select-screen').style.display='none';
  document.getElementById('battle-screen').style.display='flex';
  document.getElementById('result').classList.remove('show');

  const arenaEl = document.getElementById('arena');
  const rect = arenaEl.getBoundingClientRect();
  AW = rect.width; AH = rect.height;

  canvas = document.getElementById('canvas');
  canvas.width = AW; canvas.height = AH;
  ctx = canvas.getContext('2d');

  // 이전 라벨 제거
  arenaEl.querySelectorAll('.dmgtxt,.ring,.awaken-flash,.awaken-label,.ball-label').forEach(e=>e.remove());
  labelEls = {};

  const d1 = cloneDef(DEFS.find(d=>d.id===selected[0]));
  const d2 = cloneDef(DEFS.find(d=>d.id===selected[1]));
  p1 = makeBall(d1, AW*0.18, AH*0.5, '#e00');
  p2 = makeBall(d2, AW*0.82, AH*0.5, '#00c');
  balls=[p1,p2]; projs=[]; logs=[];
  document.getElementById('log').innerHTML='';

  // 이름 라벨 DOM 생성
  [p1,p2].forEach((b,i)=>{
    const el = document.createElement('div');
    el.className = 'ball-label';
    el.textContent = b.def.name;
    arenaEl.appendChild(el);
    labelEls[i] = el;
  });

  updateHUD(); updateDots();
  running=true; prevT=performance.now();
  raf=requestAnimationFrame(loop);
}

function stop(){ running=false; if(raf) cancelAnimationFrame(raf); projs=[]; }

function loop(ts){
  if(!running) return;
  const dt = Math.min(ts-prevT, 50); prevT=ts;
  tick(dt); render();
  raf=requestAnimationFrame(loop);
}

function tick(dt){
  const now = performance.now();
  balls.forEach(b=>{
    if(!b.alive) return;
    b.x += b.vx*(dt/16); b.y += b.vy*(dt/16);
    b.angle += 0.06;
    if(b.x-b.def.r<0){ b.x=b.def.r; b.vx=Math.abs(b.vx); }
    if(b.x+b.def.r>AW){ b.x=AW-b.def.r; b.vx=-Math.abs(b.vx); }
    if(b.y-b.def.r<0){ b.y=b.def.r; b.vy=Math.abs(b.vy); }
    if(b.y+b.def.r>AH){ b.y=AH-b.def.r; b.vy=-Math.abs(b.vy); }
    b.vx += (Math.random()-0.5)*0.07;
    b.vy += (Math.random()-0.5)*0.07;
    const spd = Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(spd<2){ b.vx*=2/spd; b.vy*=2/spd; }
    if(spd>5){ b.vx*=5/spd; b.vy*=5/spd; }

    const enemy = balls.find(o=>o!==b&&o.alive);
    if(!enemy) return;
    const dx=enemy.x-b.x, dy=enemy.y-b.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const minD=b.def.r+enemy.def.r;
    if(dist<minD&&dist>0){
      const nx=dx/dist, ny=dy/dist, ov=minD-dist;
      b.x-=nx*ov*0.5; b.y-=ny*ov*0.5;
      enemy.x+=nx*ov*0.5; enemy.y+=ny*ov*0.5;
      b.vx-=nx*2.5; b.vy-=ny*2.5;
      enemy.vx+=nx*2.5; enemy.vy+=ny*2.5;
      b.mcd-=dt;
      if(b.mcd<=0&&b.def.meleeDmg>0){
        dealDmg(enemy, b.def.meleeDmg);
        spawnRing(enemy.x, enemy.y, '#ffaa44');
        b.mcd=600;
      }
    }
    b.def.skills.forEach(sk=>{
      if(now-sk.last>=sk.cd){
        sk.last=now;
        shoot(b,enemy,sk);
        addLog(`${b.def.name} → ${sk.name}!`);
      }
    });
  });

  projs = projs.filter(p=>p.alive);
  projs.forEach(p=>{
    if(!p.alive) return;
    p.x+=p.vx; p.y+=p.vy; p.angle+=0.1;
    if(p.x<-80||p.x>AW+80||p.y<-80||p.y>AH+80){ p.alive=false; return; }
    if(!p.target.alive){ p.alive=false; return; }
    const dx=p.target.x-p.x, dy=p.target.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<p.target.def.r+14){
      dealDmg(p.target, p.dmg);
      spawnRing(p.target.x, p.target.y, p.color);
      p.alive=false;
    }
  });
}

function shoot(owner,target,sk){
  const dx=target.x-owner.x, dy=target.y-owner.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  projs.push({
    alive:true, type:sk.type,
    x:owner.x, y:owner.y,
    vx:(dx/len)*sk.spd, vy:(dy/len)*sk.spd,
    dmg:sk.dmg, color:sk.color,
    target, name:sk.name, angle:0
  });
}

function dealDmg(target,dmg){
  if(!target.alive) return;
  target.hp=Math.max(0,target.hp-dmg);
  spawnDmg(target.x,target.y,dmg);
  updateHUD();
  if(target.hp<=0){
    if(target.def.id==='nodojin'&&!target.awakened){ awaken(target); }
    else { target.alive=false; endBattle(target===p1?p2:p1); }
  }
}

function awaken(ball){
  ball.awakened=true;
  const aw=cloneDef(DEFS.find(d=>d.id==='awaken_nodojin'));
  ball.def=aw; ball.hp=aw.maxHp; ball.maxHp=aw.maxHp;
  const arenaEl=document.getElementById('arena');
  const fl=document.createElement('div'); fl.className='awaken-flash'; arenaEl.appendChild(fl);
  const lb=document.createElement('div'); lb.className='awaken-label'; lb.textContent='💥 각성!!'; arenaEl.appendChild(lb);
  setTimeout(()=>{fl.remove();lb.remove();},1300);
  // 라벨 업데이트
  const idx=balls.indexOf(ball);
  if(labelEls[idx]) labelEls[idx].textContent=aw.name;
  addLog('💥 나도진 각성!! HP 300 회복!');
  updateHUD(); updateDots();
}

function render(){
  ctx.clearRect(0,0,AW,AH);
  projs.forEach(p=>{
    if(!p.alive) return;
    if(p.type==='paddle') drawPaddle(p.x,p.y,p.angle);
    else if(p.type==='rock') drawRock(p.x,p.y,p.angle);
    else if(p.type==='LA') drawLA(p.x,p.y);
  });
  balls.forEach(b=>{ if(b.alive) drawBall(b); });

  // 이름 라벨 위치 업데이트
  balls.forEach((b,i)=>{
    const el=labelEls[i];
    if(!el||!b.alive) return;
    el.style.left=b.x+'px';
    el.style.top=(b.y+b.def.r+3)+'px';
  });
}

function spawnDmg(x,y,dmg){
  const el=document.createElement('div'); el.className='dmgtxt';
  el.textContent='-'+dmg;
  el.style.color=dmg>=80?'#cc0000':dmg>=50?'#e05000':'#e07000';
  el.style.fontSize=dmg>=80?'17px':dmg>=50?'14px':'12px';
  el.style.left=(x-12)+'px'; el.style.top=(y-18)+'px';
  document.getElementById('arena').appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function spawnRing(x,y,color){
  const el=document.createElement('div'); el.className='ring';
  const s=38;
  el.style.width=s+'px'; el.style.height=s+'px';
  el.style.left=(x-s/2)+'px'; el.style.top=(y-s/2)+'px';
  el.style.border=`2px solid ${color}`; el.style.background=color+'22';
  document.getElementById('arena').appendChild(el);
  setTimeout(()=>el.remove(),420);
}

function updateHUD(){
  [{b:p1,n:'n1',hp:'hp1',hpn:'hp1num'},{b:p2,n:'n2',hp:'hp2',hpn:'hp2num'}].forEach(({b,n,hp,hpn})=>{
    if(!b) return;
    document.getElementById(n).textContent=b.def.name;
    document.getElementById(hpn).textContent=Math.max(0,b.hp)+' / '+b.maxHp;
    document.getElementById(hp).style.width=Math.max(0,b.hp/b.maxHp*100)+'%';
  });
}

function updateDots(){
  const now=performance.now();
  [{b:p1,id:'sd1'},{b:p2,id:'sd2'}].forEach(({b,id})=>{
    if(!b) return;
    const c=document.getElementById(id); c.innerHTML='';
    (b.def.skills||[]).forEach(sk=>{
      const dot=document.createElement('div');
      const elapsed=now-sk.last;
      const ready=elapsed>=sk.cd;
      dot.className='sdot'+(ready?' ready':'');
      dot.textContent=ready?sk.label+' ✓':sk.label+' '+((sk.cd-elapsed)/1000).toFixed(1)+'s';
      c.appendChild(dot);
    });
  });
}

function endBattle(winner){
  running=false; if(raf) cancelAnimationFrame(raf); projs=[];
  document.getElementById('res-title').textContent=winner.def.name+' 승리! 🏆';
  document.getElementById('res-sub').textContent='잔여 체력: '+Math.max(0,winner.hp);
  document.getElementById('result').classList.add('show');
}

function addLog(msg){
  logs.push(msg); if(logs.length>10) logs.shift();
  const el=document.getElementById('log');
  el.innerHTML=logs.join('<br>'); el.scrollTop=el.scrollHeight;
}

setInterval(updateDots, 150);
buildCards();
</script>
</body>
</html>
